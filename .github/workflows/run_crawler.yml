name: PoongGo Crawler Auto Run

on:
  workflow_dispatch: # ◀ 깃허브 웹사이트에서 수동으로 [Run workflow] 버튼을 눌러 바로 실행할 수 있는 기능
  schedule:
    # ◀ 한국 시간(KST) 새벽 4시, 오전 10시, 오후 4시, 밤 10시에 자동으로 실행 (UTC 기준 1,7,13,19시 정각)
    - cron: '22 1,7,13,19 * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium --with-deps

    - name: Run Crawler Script
      run: |
        python poonggo_crawler.py
env:
  GAS_URL: ${{ secrets.GAS_WEB_APP_URL }}
