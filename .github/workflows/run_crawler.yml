name: PoongGo Crawler Auto Run

on:
  # 1. 수동으로 실행하고 싶을 때 (깃허브 웹사이트에서 버튼 클릭으로 실행 가능)
  workflow_dispatch:

  # 한국 시간(KST) 새벽 4시 기준 6시간마다 자동 실행
  schedule:
    # 분  시  일  월  요일 (UTC 기준)
    # 1시, 7시, 13시, 19시에 실행되도록 설정
    - cron: '22 1,7,13,19 * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest # 가상 리눅스 환경에서 실행

    steps:
    # 1. 깃허브 저장소에 있는 소스코드를 가상 컴퓨터로 가져옵니다.
    - name: Checkout source code
      uses: actions/checkout@v4

    # 2. 가상 컴퓨터에 파이썬을 설치합니다.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 크롤러에 필요한 필수 라이브러리(requests, playwright 등)를 설치합니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 웹 브라우저 크롤링을 위해 Playwright 관련 브라우저 핵심 패키지를 가상 머신에 설치합니다.
    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium --with-deps

    # 5. 파이썬 크롤러를 실행합니다. (2단계에서 저장한 GAS_URL을 안전하게 주입)
    - name: Run Crawler Script
      env:
        GAS_URL: ${{ secrets.GAS_URL }}
      run: |
        python poonggo_crawler.py
